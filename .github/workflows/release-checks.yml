name: Release metadata checks
on:
  push:
    branches: [main, plotjuggler-4.x-sdk]
  pull_request:
    branches: [main, plotjuggler-4.x-sdk]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 tests/test_release.py -v
      - run: python3 tests/test_sync_upstream.py -v
