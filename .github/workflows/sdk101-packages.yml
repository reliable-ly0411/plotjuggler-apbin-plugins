name: Published Windows packages on SDK 1.0.1

on:
  workflow_call:

permissions:
  contents: read

jobs:
  published-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 90afd65ca21c452d1c1ab87e19d4057f9dfe60e8
          path: _fixtures
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PlotJuggler/plotjuggler_sdk
          ref: ffd749ab343c3211b5100f124f6c873667b82629
          path: _sdk
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify exact SDK and download original published packages
        shell: bash
        run: |
          test "$(git -C _sdk rev-parse HEAD)" = ffd749ab343c3211b5100f124f6c873667b82629
          test "$(cat _sdk/VERSION)" = 1.0.1
          test "$(git -C _fixtures rev-parse HEAD)" = 90afd65ca21c452d1c1ab87e19d4057f9dfe60e8
          python scripts/verify_published_sdk4.py --out build/packages
      - name: Resolve host test dependencies
        shell: bash
        run: |
          python -m pip install 'conan>=2,<3' cmake ninja
          conan profile detect --force
          conan install _sdk -of build/deps -s build_type=Release -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja -o with_tests=False --build=missing
      - name: Build host test executables and load original DLLs
        shell: bash
        run: |
          cmake -S sdk4/tests/published -B build/package-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDK_SOURCE="$PWD/_sdk" -DPACKAGE_INPUT_DIR="$PWD/build/packages" -DFIXTURE_SOURCE="$PWD/_fixtures" -DCMAKE_TOOLCHAIN_FILE="$PWD/build/deps/conan_toolchain.cmake"
          cmake --build build/package-host --target published_1.2.0-pj4.rc.1 published_1.3.0-pj4.rc.1 --parallel 2
          ctest --test-dir build/package-host --output-on-failure -V
      - name: Keep original-byte and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-windows-sdk101-evidence
          path: |
            build/packages/verified-packages.json
            build/package-host/Testing/Temporary/LastTest.log
          if-no-files-found: warn
